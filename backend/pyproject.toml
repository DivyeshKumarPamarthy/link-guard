[project]
name = "linkguard-backend"
version = "0.1.0"
description = "LinkGuard backend: checks a download link before the user downloads it."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "idna>=3.20",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
# The backend is an application, not a library: uv manages the environment but does not build a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib mode lets test files in different folders share a name without __init__.py files.
# pytest-socket: tests may not open network sockets at all (tests never touch the internet).
# Unix sockets stay allowed because asyncio uses a socketpair internally.
addopts = "--import-mode=importlib --disable-socket --allow-unix-socket"
filterwarnings = [
    # Starlette suggests httpx2 for its TestClient; the pinned stack uses httpx (CLAUDE.md).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]
# tests/conftest.py and tests/ssrf/conftest.py: name modules by their full path (tests.ssrf.conftest)
explicit_package_bases = true
